<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7월 22일 업데이트 내역</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f4f4f4;
        }
        h1, h2 {
            color: #2c3e50;
        }
        .container {
            background-color: white;
            border-radius: 5px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .update-item, .usage-item {
            margin-bottom: 20px;
            padding: 10px;
            background-color: #ecf0f1;
            border-left: 4px solid #3498db;
            border-radius: 0 5px 5px 0;
        }
        .key {
            display: inline-block;
            padding: 2px 8px;
            margin: 0 2px;
            background-color: #3498db;
            color: white;
            border-radius: 3px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>7월 22일 업데이트 내역</h1>

        <h2>볼륨 컨트롤러 추가</h2>
        <div class="update-item">
            <p>트랙명 옆 볼륨 슬라이더로 배경음악 볼륨 조절이 가능합니다.</p>
        </div>

        <h2>컴퓨터 키보드 조작 기능 추가</h2>
        <div class="usage-item">
            <p>숫자키 <span class="key">1</span> to <span class="key">9</span> 또는 <span class="key">A S D F H J K L ;</span> 로 연주가 가능합니다.</p>
        </div>
        <div class="usage-item">
            <p> <span class="key">스페이스바</span>를 이용해 배경음악을 재생/일시정지 할 수 있습니다.</p>
        </div>
    </div>
</body>
</html>
