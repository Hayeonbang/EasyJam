
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percussion1</title>
    <!-- CSS 파일 불러오기 -->
    <link rel="stylesheet" href="css/drum1.css">
</head>
<body>
    <!-- 웹캠 스트림을 보여주는 비디오 -->
    <video id="webcam" autoplay playsinline width="640" height="480"></video>
    <!-- 추적된 결과를 시각화할 캔버스 -->
    <canvas id="output" width="640" height="480"></canvas>

    <!-- 악기 이미지 -->
    <img id="shaker" src="/assets/images/drum1/shaker.png" alt="Shaker">
    <img id="triangle" src="/assets/images/drum1/triangle.png" alt="Triangle">
    <audio id="shakerSound" src="/assets/sounds/drum1/shaker.ogg"></audio>
    <audio id="triangleSound" src="/assets/sounds/drum1/triangle.ogg"></audio>

    <!-- TensorFlow.js 및 PoseNet 라이브러리 추가 -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/posenet"></script>

    <!-- JavaScript 파일 불러오기 -->
    <script src="js/drum1.js"></script>
</body>
</html>
