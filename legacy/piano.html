<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyJam: Piano</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        
        h1 {
            font-size: 2.5em;
            margin: 20px 0;
            color: #f39c12;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        #pianoImage {
            max-width: 100%;
            height: auto;
            margin-top: 200px; /* 세로 중앙 정렬 */
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        }
        
        /* 오디오 플레이어 스타일 */
        .audio-player {
            background-color: rgba(0, 0, 0, 0.8);
            padding: 10px 20px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .audio-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .progress-container {
            flex-grow: 1;
            height: 5px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            overflow: hidden;
            margin: 0 20px;
            cursor: pointer;
        }

        #progress {
            width: 0;
            height: 100%;
            background-color: #f39c12;
            transition: width 0.1s linear;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .volume-control label {
            font-size: 14px;
            color: #cccccc;
        }

        .volume-control input[type="range"] {
            -webkit-appearance: none;
            width: 100px;
            height: 5px;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            border-radius: 5px;
            transition: opacity 0.2s;
        }

        .volume-control input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            background: #f39c12;
            cursor: pointer;
            border-radius: 50%;
        }

        .volume-control input[type="range"]::-moz-range-thumb {
            width: 12px;
            height: 12px;
            background: #f39c12;
            cursor: pointer;
            border-radius: 50%;
        }

        button {
            background-color: transparent;
            border: none;
            color: #f39c12;
            font-size: 24px;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        button:hover {
            color: #e67e22;
        }
    </style>
</head>
<body>
    <div class="audio-player">
        <div class="audio-controls">
            <button id="playPauseBtn">▶</button>
            <button id="stopBtn">■</button>
        </div>
        <div class="progress-container">
            <div id="progress"></div>
        </div>
        <div class="volume-control">
            <label for="backingVolume">Backing:</label>
            <input type="range" id="backingVolume" min="0" max="1" step="0.1" value="1">
        </div>
        <div class="volume-control">
            <label for="soloVolume">Piano:</label>
            <input type="range" id="soloVolume" min="0" max="1" step="0.1" value="1">
        </div>
    </div>
    <img id="pianoImage" src="assets/images/piano/Default.png" alt="Piano Keys">

    <script src="js/piano.js"></script>
</body>
</html>
